            const loadData = async () => {
                setLoading(true);
                try {
                    // Load settings
                    const { data: settings, error: settingsError } = await supabase
                        .from('user_settings')
                        .select('*')
                        .eq('user_id', user.id)
                        .single();
                    
                    if (settings) {
                        setCurrency(settings.currency || 'USD');
                        setLanguage(settings.language || 'en');
                        setUserName(settings.name || '');
                        setUserAge(settings.age || '');
                    } else if (settingsError && settingsError.code === 'PGRST116') {
                        // No settings row exists, create one
                        await supabase.from('user_settings').insert({
                            user_id: user.id,
                            currency: 'USD',
                            language: 'en'
                        });
                    }

                    // Load transactions for current month
                    const startOfMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).toISOString().split('T')[0];
                    const endOfMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).toISOString().split('T')[0];
                    
                    const { data: txData, error: txError } = await supabase
                        .from('transactions')
                        .select('*')
                        .eq('user_id', user.id)
                        .gte('date', startOfMonth)
                        .lte('date', endOfMonth)
                        .order('date', { ascending: false });
                    
                    if (txError) throw txError;
                    setTransactions(txData || []);

                    // Load goals
                    const { data: goalsData, error: goalsError } = await supabase
                        .from('goals')
                        .select('*')
                        .eq('user_id', user.id);
                    
                    if (goalsError) throw goalsError;
                    setGoals(goalsData || []);

                    // Load recurring transactions
                    const { data: recurringData } = await supabase
                        .from('recurring_transactions')
                        .select('*')
                        .eq('user_id', user.id)
                        .order('created_at', { ascending: false });
                    
                    setRecurringTransactions(recurringData || []);

                    // Load loans
                    const { data: loansData } = await supabase
                        .from('loans')
                        .select('*')
                        .eq('user_id', user.id)
                        .order('created_at', { ascending: false });
                    
                    setLoans(loansData || []);

                    // Apply recurring transactions for current month
                    await applyRecurringTransactions(recurringData || [], startOfMonth, endOfMonth);

                } catch (error) {
                    console.error('Error loading data:', error);
                } finally {
                    setLoading(false);
                }
            };

            // Apply recurring transactions automatically
            const applyRecurringTransactions = async (recurring, startOfMonth, endOfMonth) => {
                const today = new Date();
                const currentMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
                
                for (const rec of recurring) {
                    if (!rec.is_active) continue;
                    
                    const lastApplied = rec.last_applied ? rec.last_applied.substring(0, 7) : null;
                    if (lastApplied === currentMonth) continue;
                    
                    // Check if day has passed this month
                    if (today.getDate() >= rec.day_of_month) {
                        const txDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(rec.day_of_month).padStart(2, '0')}`;
                        
                        // Insert transaction
                        await supabase.from('transactions').insert({
                            user_id: user.id,
                            type: rec.type,
                            amount: rec.amount,
                            category: rec.category,
                            date: txDate,
                            description: rec.description || `Recurring: ${rec.category}`
                        });
                        
                        // Update last_applied
                        await supabase.from('recurring_transactions')
                            .update({ last_applied: txDate })
                            .eq('id', rec.id);
                    }
                }
            };

            const handleAddTransaction = async (e) => {
                e.preventDefault();
                setSubmitting(true);

                try {
                    const { error } = await supabase.from('transactions').insert({
                        user_id: user.id,
                        type: transactionType,
                        amount: parseFloat(txForm.amount),
                        category: txForm.category,
                        date: txForm.date,
                        description: txForm.description
                    });

                    if (error) throw error;

                    setTxForm({ amount: '', category: '', date: new Date().toISOString().split('T')[0], description: '' });
                    loadData();
                } catch (error) {
                    console.error('Error adding transaction:', error);
                    alert('Failed to add transaction');
                } finally {
                    setSubmitting(false);
                }
            };

            const handleDeleteTransaction = async (id) => {
                try {
                    const { error } = await supabase.from('transactions').delete().eq('id', id);
                    if (error) throw error;
                    loadData();
                } catch (error) {
                    console.error('Error deleting transaction:', error);
                }
            };

            const handleSaveGoal = async (e) => {
                e.preventDefault();
                try {
                    const { error } = await supabase.from('goals').insert({
                        user_id: user.id,
                        name: goalForm.name,
                        target: parseFloat(goalForm.target),
                        current: parseFloat(goalForm.current) || 0,
                        icon: goalForm.icon
                    });

                    if (error) throw error;
                    setGoalModalOpen(false);
                    setGoalForm({ name: '', target: '', current: '0', icon: '🎯' });
                    loadData();
                } catch (error) {
                    console.error('Error saving goal:', error);
                    alert('Failed to save goal');
                }
            };

            const handleAddFunds = async (e) => {
                e.preventDefault();
                if (!selectedGoal) return;

                try {
                    const newCurrent = Math.min(
                        parseFloat(selectedGoal.current) + parseFloat(addFundsAmount),
                        parseFloat(selectedGoal.target)
                    );

                    const { error } = await supabase
                        .from('goals')
                        .update({ current: newCurrent })
                        .eq('id', selectedGoal.id);

                    if (error) throw error;
                    setAddFundsModalOpen(false);
                    setAddFundsAmount('');
                    setSelectedGoal(null);
                    loadData();
                } catch (error) {
                    console.error('Error adding funds:', error);
                }
            };

            const handleDeleteGoal = async (id) => {
                if (!confirm('Delete this goal?')) return;
                try {
                    const { error } = await supabase.from('goals').delete().eq('id', id);
                    if (error) throw error;
                    loadData();
                } catch (error) {
                    console.error('Error deleting goal:', error);
                }
            };

            const handleCurrencyChange = async (newCurrency) => {
                setCurrency(newCurrency);
                try {
                    const { error } = await supabase
                        .from('user_settings')
                        .update({ currency: newCurrency })
                        .eq('user_id', user.id);
                    if (error) throw error;
                } catch (error) {
                    console.error('Error saving currency:', error);
                }
            };

            const handleProfileUpdate = async (field, value) => {
                if (field === 'name') {
                    setUserName(value);
                } else if (field === 'age') {
                    setUserAge(value);
                }
                
                try {
                    // First check if settings exist
                    const { data: existing } = await supabase
                        .from('user_settings')
                        .select('user_id')
                        .eq('user_id', user.id)
                        .single();
                    
                    const updateData = {};
                    updateData[field] = field === 'age' ? (value ? parseInt(value) : null) : value;
                    
                    if (existing) {
                        // Update existing row
                        const { error } = await supabase
                            .from('user_settings')
                            .update(updateData)
                            .eq('user_id', user.id);
                        if (error) throw error;
                    } else {
                        // Insert new row
                        const { error } = await supabase
                            .from('user_settings')
                            .insert({ user_id: user.id, currency: 'USD', language: 'en', ...updateData });
                        if (error) throw error;
                    }
                } catch (error) {
                    console.error('Error saving profile:', error);
                }
            };

            const changeMonth = (delta) => {
                const newDate = new Date(viewDate);
                newDate.setMonth(newDate.getMonth() + delta);
                setViewDate(newDate);
            };

            // Language change handler
            const handleLanguageChange = async (newLang) => {
                const oldLang = language;
                setLanguage(newLang);
                
                // Translate currently selected category in transaction form
                if (txForm.category) {
                    const translatedCat = translateCategory(txForm.category, oldLang, newLang);
                    setTxForm(prev => ({ ...prev, category: translatedCat }));
                }
                
                // Translate currently selected category in recurring form
                if (recurringForm.category) {
                    const translatedCat = translateCategory(recurringForm.category, oldLang, newLang);
                    setRecurringForm(prev => ({ ...prev, category: translatedCat }));
                }
                
                try {
                    const { error } = await supabase
                        .from('user_settings')
                        .update({ language: newLang })
                        .eq('user_id', user.id);
                    if (error) throw error;
                } catch (error) {
                    console.error('Error saving language:', error);
                }
            };

            // Delete confirmation handlers
            const openDeleteModal = (type, id, name) => {
                setDeleteTarget({ type, id, name });
                setDeleteModalOpen(true);
            };

            const handleConfirmDelete = async () => {
                setDeleting(true);
                try {
                    if (deleteTarget.type === 'transaction') {
                        await supabase.from('transactions').delete().eq('id', deleteTarget.id);
                        setTransactions(prev => prev.filter(t => t.id !== deleteTarget.id));
                    } else if (deleteTarget.type === 'recurring') {
                        await supabase.from('recurring_transactions').delete().eq('id', deleteTarget.id);
                        setRecurringTransactions(prev => prev.filter(r => r.id !== deleteTarget.id));
                    } else if (deleteTarget.type === 'loan') {
                        await supabase.from('loans').delete().eq('id', deleteTarget.id);
                        setLoans(prev => prev.filter(l => l.id !== deleteTarget.id));
                    }
                    setDeleteModalOpen(false);
                } catch (error) {
                    console.error('Error deleting:', error);
                } finally {
                    setDeleting(false);
                }
            };

            // Recurring transaction handlers
            const openRecurringModal = (recurring = null) => {
                if (recurring) {
                    setSelectedRecurring(recurring);
                    setRecurringForm({
                        type: recurring.type,
                        amount: recurring.amount.toString(),
                        category: recurring.category,
                        description: recurring.description || '',
                        day_of_month: recurring.day_of_month.toString(),
                        is_active: recurring.is_active
                    });
                } else {
                    setSelectedRecurring(null);
                    setRecurringForm({
                        type: 'expense', amount: '', category: '', description: '', day_of_month: '1', is_active: true
                    });
                }
                setRecurringModalOpen(true);
            };

            const handleSaveRecurring = async (e) => {
                e.preventDefault();
                setSubmitting(true);
                try {
                    const data = {
                        user_id: user.id,
                        type: recurringForm.type,
                        amount: parseFloat(recurringForm.amount),
                        category: recurringForm.category,
                        description: recurringForm.description,
                        day_of_month: parseInt(recurringForm.day_of_month),
                        is_active: recurringForm.is_active
                    };

                    if (selectedRecurring) {
                        await supabase.from('recurring_transactions').update(data).eq('id', selectedRecurring.id);
                        setRecurringTransactions(prev => prev.map(r => r.id === selectedRecurring.id ? { ...r, ...data } : r));
                    } else {
                        const { data: newRec } = await supabase.from('recurring_transactions').insert(data).select().single();
                        setRecurringTransactions(prev => [newRec, ...prev]);
                    }
                    setRecurringModalOpen(false);
                } catch (error) {
                    console.error('Error saving recurring:', error);
                } finally {
                    setSubmitting(false);
                }
            };

            // Loan handlers
            const openLoanModal = (loan = null) => {
                if (loan) {
                    setSelectedLoan(loan);
                    setLoanForm({
                        name: loan.name,
                        principal: loan.principal.toString(),
                        interest_rate: loan.interest_rate.toString(),
                        term_months: loan.term_months.toString(),
                        monthly_payment: loan.monthly_payment.toString(),
                        start_date: loan.start_date
                    });
                } else {
                    setSelectedLoan(null);
                    setLoanForm({
                        name: '', principal: '', interest_rate: '', term_months: '', monthly_payment: '', start_date: new Date().toISOString().split('T')[0]
                    });
                }
                setLoanModalOpen(true);
            };

            const handleSaveLoan = async (e) => {
                e.preventDefault();
                setSubmitting(true);
                try {
                    const data = {
                        user_id: user.id,
                        name: loanForm.name,
                        principal: parseFloat(loanForm.principal),
                        interest_rate: parseFloat(loanForm.interest_rate),
                        term_months: parseInt(loanForm.term_months),
                        monthly_payment: parseFloat(loanForm.monthly_payment),
                        start_date: loanForm.start_date
                    };

                    if (selectedLoan) {
                        await supabase.from('loans').update(data).eq('id', selectedLoan.id);
                        setLoans(prev => prev.map(l => l.id === selectedLoan.id ? { ...l, ...data } : l));
                    } else {
                        const { data: newLoan } = await supabase.from('loans').insert(data).select().single();
                        setLoans(prev => [newLoan, ...prev]);
                    }
                    setLoanModalOpen(false);
                } catch (error) {
                    console.error('Error saving loan:', error);
                } finally {
                    setSubmitting(false);
                }
            };

            // Calculate loan progress
            const getLoanProgress = (loan) => {
                const totalAmount = loan.principal * (1 + (loan.interest_rate / 100) * (loan.term_months / 12));
                const progress = (loan.total_paid / totalAmount) * 100;
                return { totalAmount, progress: Math.min(progress, 100) };
            };

            const handleExport = async () => {
                const { data: allTx } = await supabase
                    .from('transactions')
                    .select('*')
                    .eq('user_id', user.id);
                
                const exportData = {
                    version: '2.0',
                    currency,
                    exportDate: new Date().toISOString(),
                    transactions: allTx || [],
                    goals
                };

                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `tracker-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                setSidebarOpen(false);
            };

            // Calculate summary
            const income = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + parseFloat(t.amount), 0);
            const expenses = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + parseFloat(t.amount), 0);
            const balance = income - expenses;

            // Calculate spending statistics
            const expenseTransactions = transactions.filter(t => t.type === 'expense');
            
            // Days elapsed in current month
            const today = new Date();
            const currentDay = today.getDate();
            const daysInCurrentMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
            const daysElapsed = viewDate.getMonth() === today.getMonth() && viewDate.getFullYear() === today.getFullYear() 
                ? currentDay 
                : daysInCurrentMonth;
            
            // Average spending per day
            const avgPerDay = daysElapsed > 0 ? expenses / daysElapsed : 0;
            
            // Find top spending category
            const categoryTotals = {};
            expenseTransactions.forEach(t => {
                categoryTotals[t.category] = (categoryTotals[t.category] || 0) + parseFloat(t.amount);
            });
            const topCategory = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1])[0];
            
            // Food spending (multiple food-related categories)
            const foodCategories = language === 'he' 
                ? ['מזון', 'מסעדות', 'קפה'] 
                : ['Food', 'Restaurants', 'Coffee'];
            const foodSpending = expenseTransactions
                .filter(t => foodCategories.some(cat => t.category.includes(cat) || cat.includes(t.category)))
                .reduce((sum, t) => sum + parseFloat(t.amount), 0);

            // Filter transactions
            let filteredTransactions = transactions;
            if (filterCategory) filteredTransactions = filteredTransactions.filter(t => t.category === filterCategory);
            if (filterType) filteredTransactions = filteredTransactions.filter(t => t.type === filterType);
            if (searchTerm) {
                filteredTransactions = filteredTransactions.filter(t =>
                    t.category.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    (t.description && t.description.toLowerCase().includes(searchTerm.toLowerCase()))
                );
            }

            // Chart rendering
            const renderCategoryChart = () => {
                if (!categoryChartRef.current) return;
                
                const expenseData = transactions.filter(t => t.type === 'expense');
                const byCategory = {};
                expenseData.forEach(t => {
                    byCategory[t.category] = (byCategory[t.category] || 0) + parseFloat(t.amount);
                });

                const labels = Object.keys(byCategory);
                const data = Object.values(byCategory);
                const colors = labels.map(l => categoryColors[l] || '#64748b');

                if (categoryChartInstance.current) {
                    categoryChartInstance.current.destroy();
                }

                categoryChartInstance.current = new Chart(categoryChartRef.current, {
                    type: 'doughnut',
                    data: {
                        labels,
                        datasets: [{ data, backgroundColor: colors, borderWidth: 0, hoverOffset: 8 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '65%',
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: { color: '#94a3b8', boxWidth: 12, padding: 16, font: { family: 'Inter', size: 12 } }
                            }
                        }
                    }
                });
            };

            const renderTrendChart = async () => {
                if (!trendChartRef.current) return;

                const months = [];
                const incomeData = [];
                const expenseData = [];

                for (let i = 5; i >= 0; i--) {
                    const d = new Date(viewDate.getFullYear(), viewDate.getMonth() - i, 1);
                    months.push(d.toLocaleDateString('en-US', { month: 'short' }));

                    const startOfMonth = new Date(d.getFullYear(), d.getMonth(), 1).toISOString().split('T')[0];
                    const endOfMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().split('T')[0];

                    const { data: monthTx } = await supabase
                        .from('transactions')
                        .select('*')
                        .eq('user_id', user.id)
                        .gte('date', startOfMonth)
                        .lte('date', endOfMonth);

                    const monthData = monthTx || [];
                    incomeData.push(monthData.filter(t => t.type === 'income').reduce((s, t) => s + parseFloat(t.amount), 0));
                    expenseData.push(monthData.filter(t => t.type === 'expense').reduce((s, t) => s + parseFloat(t.amount), 0));
                }

                if (trendChartInstance.current) {
                    trendChartInstance.current.destroy();
                }

                trendChartInstance.current = new Chart(trendChartRef.current, {
                    type: 'bar',
                    data: {
                        labels: months,
                        datasets: [
                            { label: 'Income', data: incomeData, backgroundColor: 'rgba(34, 197, 94, 0.8)', borderRadius: 6, borderSkipped: false },
                            { label: 'Expenses', data: expenseData, backgroundColor: 'rgba(239, 68, 68, 0.8)', borderRadius: 6, borderSkipped: false }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { ticks: { color: '#64748b', font: { family: 'Inter' } }, grid: { display: false } },
                            y: { ticks: { color: '#64748b', font: { family: 'Inter' } }, grid: { color: 'rgba(255, 255, 255, 0.05)', drawBorder: false } }
                        },
                        plugins: {
                            legend: { labels: { color: '#94a3b8', font: { family: 'Inter' }, boxWidth: 12, padding: 20 } }
                        }
                    }
                });
            };

            if (loading) {
                return (
                    <div className="full-loading">
                        <div className="loading-spinner"></div>
                        <p>Loading your data...</p>
                    </div>
                );
            }

            return (
                <div className="app-container" dir={language === 'he' ? 'rtl' : 'ltr'}>
                    {/* Settings Button */}
                    <button className="settings-btn" onClick={() => setSidebarOpen(true)}>⚙️</button>

                    {/* Sidebar Overlay */}
                    <div className={`sidebar-overlay ${sidebarOpen ? 'active' : ''}`} onClick={() => setSidebarOpen(false)} />

                    {/* Settings Sidebar */}
                    <div className={`settings-sidebar ${sidebarOpen ? 'active' : ''}`}>
                        <div className="sidebar-header">
                            <h2>⚙️ {t('settings')}</h2>
                            <button className="close-btn" onClick={() => setSidebarOpen(false)}>✕</button>
                        </div>
                        <div className="sidebar-content">
                            {/* User Profile Section */}
                            <div className="settings-section user-profile-section">
                                <div className="user-profile-header">
                                    <div className="user-avatar-large">{userName ? userName[0].toUpperCase() : user.email[0].toUpperCase()}</div>
                                    <div className="user-profile-info">
                                        <span className="user-name">{userName || t('user')}</span>
                                        <span className="user-email-small">{user.email}</span>
                                    </div>
                                </div>
                                <div className="setting-item">
                                    <label>{t('name')}</label>
                                    <input
                                        type="text"
                                        value={userName}
                                        onChange={(e) => handleProfileUpdate('name', e.target.value)}
                                        placeholder={t('enterName')}
                                    />
                                </div>
                                <div className="setting-item">
                                    <label>{t('age')}</label>
                                    <input
                                        type="number"
                                        value={userAge}
                                        onChange={(e) => handleProfileUpdate('age', e.target.value)}
                                        placeholder={t('enterAge')}
                                        min="1"
                                        max="120"
                                    />
                                </div>
                            </div>
                            <div className="settings-section">
                                <h3>{t('navigation')}</h3>
                                <div className="setting-item">
                                    <label>{t('selectMonth')}</label>
                                    <div className="year-selector">
                                        <button onClick={() => setViewDate(new Date(viewDate.getFullYear() - 1, viewDate.getMonth(), 1))}>‹</button>
                                        <span>{viewDate.getFullYear()}</span>
                                        <button onClick={() => setViewDate(new Date(viewDate.getFullYear() + 1, viewDate.getMonth(), 1))}>›</button>
                                    </div>
                                    <div className="month-grid">
                                        {t('months').map((month, index) => {
                                            const isActive = viewDate.getMonth() === index;
                                            const now = new Date();
                                            const isCurrent = now.getFullYear() === viewDate.getFullYear() && now.getMonth() === index;
                                            const isFuture = new Date(viewDate.getFullYear(), index, 1) > now;
                                            return (
                                                <button
                                                    key={month}
                                                    className={`${isActive ? 'active' : ''} ${isCurrent ? 'current-month' : ''} ${isFuture ? 'future' : ''}`}
                                                    onClick={() => setViewDate(new Date(viewDate.getFullYear(), index, 1))}
                                                >
                                                    {month}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                            <div className="settings-section">
                                <h3>{t('preferences')}</h3>
                                <div className="setting-item">
                                    <label>{t('language')}</label>
                                    <select value={language} onChange={(e) => handleLanguageChange(e.target.value)}>
                                        <option value="en">🇺🇸 {t('english')}</option>
                                        <option value="he">🇮🇱 {t('hebrew')}</option>
                                    </select>
                                </div>
                                <div className="setting-item">
                                    <label>{t('currency')}</label>
                                    <select value={currency} onChange={(e) => handleCurrencyChange(e.target.value)}>
                                        {currencyOptions.map(opt => (
                                            <option key={opt.code} value={opt.code}>{opt.name}</option>
                                        ))}
                                    </select>
                                    <div className="currency-preview">
                                        <span className="preview-label">{t('preview')}:</span>
                                        <span>{formatCurrency(1234.56, currency)}</span>
                                    </div>
                                </div>
                            </div>
                            <div className="settings-section">
                                <h3>{t('data')}</h3>
                                <div className="sidebar-actions">
                                    <button className="btn-export" onClick={handleExport}>📥 {t('exportData')}</button>
                                </div>
                            </div>
                            <div className="settings-section">
                                <h3>{t('account')}</h3>
                                <div className="sidebar-actions">
                                    <button className="btn-logout" onClick={onLogout}>🚪 {t('signOut')}</button>
                                </div>
                            </div>
                        </div>
                        <div className="sidebar-footer">
                            <p>{t('version')}</p>
                            <div className="storage-info">
                                <span className="storage-dot"></span>
                                <span>{t('cloudSync')}</span>
                            </div>
                        </div>
                    </div>

                    {/* Goal Modal */}
                    <div className={`modal-overlay ${goalModalOpen ? 'active' : ''}`}>
                        <div className="modal">
                            <h3>🎯 New Savings Goal</h3>
                            <form onSubmit={handleSaveGoal}>
                                <div className="form-group">
                                    <label>Goal Name</label>
                                    <input
                                        type="text"
                                        value={goalForm.name}
                                        onChange={(e) => setGoalForm({ ...goalForm, name: e.target.value })}
                                        placeholder="e.g., Vacation, New Laptop"
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Target Amount</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        min="1"
                                        value={goalForm.target}
                                        onChange={(e) => setGoalForm({ ...goalForm, target: e.target.value })}
                                        placeholder="0.00"
                                        required
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Current Savings (optional)</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        min="0"
                                        value={goalForm.current}
                                        onChange={(e) => setGoalForm({ ...goalForm, current: e.target.value })}
                                        placeholder="0.00"
                                    />
                                </div>
                                <div className="form-group">
                                    <label>Choose Icon</label>
                                    <div className="icon-selector">
                                        {goalIcons.map(icon => (
                                            <div
                                                key={icon}
                                                className={`icon-option ${goalForm.icon === icon ? 'selected' : ''}`}
                                                onClick={() => setGoalForm({ ...goalForm, icon })}
                                            >
                                                {icon}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="modal-actions">
                                    <button type="button" className="btn-cancel" onClick={() => setGoalModalOpen(false)}>Cancel</button>
                                    <button type="submit" className="btn-save">Save Goal</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    {/* Add Funds Modal */}
                    <div className={`modal-overlay ${addFundsModalOpen ? 'active' : ''}`}>
                        <div className="modal">
                            <h3>💰 Add Funds</h3>
                            <form onSubmit={handleAddFunds}>
                                <div className="form-group">
                                    <label>Goal: <span style={{ color: '#c084fc' }}>{selectedGoal?.name}</span></label>
                                </div>
                                <div className="form-group">
                                    <label>Amount to Add</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        min="0.01"
                                        value={addFundsAmount}
                                        onChange={(e) => setAddFundsAmount(e.target.value)}
                                        placeholder="0.00"
                                        required
                                    />
                                </div>
                                <div className="modal-actions">
                                    <button type="button" className="btn-cancel" onClick={() => setAddFundsModalOpen(false)}>Cancel</button>
                                    <button type="submit" className="btn-save">Add Funds</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div className="container">
                        <header>
                            <div className="header-logo">
                                <AnimatedLogo size="large" />
                            </div>
                            <p>{t('smartExpense')}</p>
                        </header>

                        {/* Month Display */}
                        <div className="month-display">
                            <span>{getMonthYear(viewDate)}</span>
                        </div>

                        {/* Balance Hero */}
                        <div className="balance-hero">
                            <h2>{t('currentBalance')}</h2>
                            <div className={`balance-amount ${balance > 0 ? 'positive' : balance < 0 ? 'negative' : ''}`}>
                                {formatCurrency(balance, currency)}
                            </div>
                            <p className="balance-subtitle">{t('incomeMinusExpenses')}</p>
                        </div>

                        {/* Summary Grid */}
                        <div className="summary-grid">
                            <div className="summary-card income">
                                <h3>{t('totalIncome')}</h3>
                                <div className="amount">{formatCurrency(income, currency)}</div>
                            </div>
                            <div className="summary-card expense">
                                <h3>{t('totalExpenses')}</h3>
                                <div className="amount">{formatCurrency(expenses, currency)}</div>
                            </div>
                        </div>

                        {/* Goals Section */}
                        <div className="goals-section">
                            <div className="goals-header">
                                <h2><span className="icon">🎯</span> {t('savingsGoals')}</h2>
                                <button className="add-goal-btn" onClick={() => setGoalModalOpen(true)}>{t('addGoal')}</button>
                            </div>
                            <div className="goals-grid">
                                {goals.length === 0 ? (
                                    <div className="no-goals">{t('startTracking')}</div>
                                ) : (
                                    goals.map(goal => {
                                        const progress = Math.min((parseFloat(goal.current) / parseFloat(goal.target)) * 100, 100);
                                        const isComplete = progress >= 100;
                                        return (
                                            <div key={goal.id} className="goal-card">
                                                <div className="goal-header">
                                                    <div className="goal-info">
                                                        <h4>{goal.name}</h4>
                                                        <span>{isComplete ? '✓' : `${progress.toFixed(0)}%`}</span>
                                                    </div>
                                                    <div className="goal-icon">{goal.icon}</div>
                                                </div>
                                                <div className="goal-progress">
                                                    <div className="goal-progress-bar">
                                                        <div className={`goal-progress-fill ${isComplete ? 'complete' : ''}`} style={{ width: `${progress}%` }} />
                                                    </div>
                                                    <div className="goal-amounts">
                                                        <span className="goal-current">{formatCurrency(goal.current, currency)}</span>
                                                        <span className="goal-target">of {formatCurrency(goal.target, currency)}</span>
                                                    </div>
                                                </div>
                                                <div className="goal-actions">
                                                    <button className="goal-add-funds" onClick={() => { setSelectedGoal(goal); setAddFundsModalOpen(true); }}>+ Add Funds</button>
                                                    <button className="goal-delete" onClick={() => handleDeleteGoal(goal.id)}>×</button>
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        {/* Main Grid */}
                        <div className="grid">
                            {/* Add Transaction Card */}
                            <div className={`card form-card ${transactionType}-mode`}>
                                <h2><span className="icon">➕</span> {t('addTransaction')}</h2>
                                <div className="tabs">
                                    <div
                                        className={`tab expense-tab ${transactionType === 'expense' ? 'active' : ''}`}
                                        onClick={() => setTransactionType('expense')}
                                    >
                                        {t('expense')}
                                    </div>
                                    <div
                                        className={`tab income-tab ${transactionType === 'income' ? 'active' : ''}`}
                                        onClick={() => setTransactionType('income')}
                                    >
                                        {t('income')}
                                    </div>
                                </div>
                                <form onSubmit={handleAddTransaction}>
                                    <div className="inline-form">
                                        <div className="form-group">
                                            <label>{t('amount')}</label>
                                            <div className="input-with-prefix">
                                                <span className="currency-prefix">{currencySymbols[currency]}</span>
                                                <input
                                                    type="number"
                                                    step="0.01"
                                                    min="0"
                                                    value={txForm.amount}
                                                    onChange={(e) => setTxForm({ ...txForm, amount: e.target.value })}
                                                    placeholder="0.00"
                                                    required
                                                />
                                            </div>
                                        </div>
                                        <div className="form-group">
                                            <label>{t('category')}</label>
                                            <select
                                                value={txForm.category}
                                                onChange={(e) => setTxForm({ ...txForm, category: e.target.value })}
                                                required
                                            >
                                                <option value="">{t('selectCategory')}</option>
                                                {categories[transactionType].map(cat => (
                                                    <option key={cat} value={cat}>{cat}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="form-group">
                                            <label>{t('date')}</label>
                                            <input
                                                type="date"
                                                value={txForm.date}
                                                onChange={(e) => setTxForm({ ...txForm, date: e.target.value })}
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>{t('description')}</label>
                                            <input
                                                type="text"
                                                value={txForm.description}
                                                onChange={(e) => setTxForm({ ...txForm, description: e.target.value })}
                                                placeholder={t('optional')}
                                            />
                                        </div>
                                        <div className="form-group full-width">
                                            <button type="submit" className="submit-btn" disabled={submitting}>
                                                {submitting ? t('adding') : t('add')}
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>

                            {/* Category Chart */}
                            <div className="card">
                                <h2><span className="icon">📊</span> {t('expensesByCategory')}</h2>
                                <div className="chart-container">
                                    <canvas ref={categoryChartRef}></canvas>
                                </div>
                            </div>
                        </div>

                        <div className="grid">
                            {/* Trend Chart */}
                            <div className="card">
                                <h2><span className="icon">📈</span> {t('incomeVsExpenses')}</h2>
                                <div className="chart-container">
                                    <canvas ref={trendChartRef}></canvas>
                                </div>
                                
                                {/* Spending Statistics */}
                                <div className="spending-stats">
                                    <div className="stat-item">
                                        <div className="stat-value">{formatCurrency(avgPerDay, currency)}</div>
                                        <div className="stat-label">{t('avgPerDay')}</div>
                                    </div>
                                    <div className="stat-item highlight">
                                        <div className="stat-value">{topCategory ? topCategory[0] : '-'}</div>
                                        <div className="stat-label">{t('topCategory')}</div>
                                    </div>
                                    <div className="stat-item">
                                        <div className="stat-value">{formatCurrency(foodSpending, currency)}</div>
                                        <div className="stat-label">{t('foodSpending')}</div>
                                    </div>
                                </div>
                            </div>

                            {/* Transactions List */}
                            <div className="card">
                                <h2><span className="icon">📝</span> {t('transactions')}</h2>
                                <div className="search-box">
                                    <input
                                        type="text"
                                        placeholder={t('searchTransactions')}
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>
                                <div className="filter-row">
                                    <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)}>
                                        <option value="">{t('allCategories')}</option>
                                        {[...categories.expense, ...categories.income].map(cat => (
                                            <option key={cat} value={cat}>{cat}</option>
                                        ))}
                                    </select>
                                    <select value={filterType} onChange={(e) => setFilterType(e.target.value)}>
                                        <option value="">{t('allTypes')}</option>
                                        <option value="income">{t('income')}</option>
                                        <option value="expense">{t('expense')}</option>
                                    </select>
                                </div>
                                <div className="transactions-list">
                                    {filteredTransactions.length === 0 ? (
                                        <div className="empty-state">
                                            <div className="empty-state-icon">📭</div>
                                            {t('noTransactions')}
                                        </div>
                                    ) : (
                                        filteredTransactions.map(tx => (
                                            <div key={tx.id} className={`transaction ${tx.type}`}>
                                                <div className="transaction-info">
                                                    <h4>{tx.category}</h4>
                                                    <span>{formatDate(tx.date)}{tx.description ? ` • ${tx.description}` : ''}</span>
                                                </div>
                                                <div className={`transaction-amount ${tx.type === 'income' ? 'positive' : 'negative'}`}>
                                                    {tx.type === 'income' ? '+' : '-'}{formatCurrency(tx.amount, currency)}
                                                    <button className="delete-btn" onClick={() => openDeleteModal('transaction', tx.id, tx.category)}>×</button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <div className="stats-row">
                                    <span>{transactions.length} {t('transactions').toLowerCase()}</span>
                                    <span>☁️ {t('cloudSync')}</span>
                                </div>
                            </div>
                        </div>

                        {/* Recurring Transactions Section */}
                        <div className="card" style={{marginBottom: '24px'}}>
                            <div className="section-header" style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px'}}>
                                <h2><span className="icon">🔄</span> {t('recurringTransactions')}</h2>
                                <button className="add-goal-btn" onClick={() => openRecurringModal()}>{t('addRecurring')}</button>
                            </div>
                            {recurringTransactions.length === 0 ? (
                                <div className="empty-state">
                                    <p>{t('noRecurring')}</p>
                                    <p style={{fontSize: '0.8rem', marginTop: '8px'}}>{t('recurringDesc')}</p>
                                </div>
                            ) : (
                                recurringTransactions.map(rec => (
                                    <div key={rec.id} className="recurring-item">
                                        <div className="recurring-info">
                                            <h4>
                                                {rec.category}
                                                <span className={`status-badge ${rec.is_active ? 'active' : 'inactive'}`}>
                                                    {rec.is_active ? t('active') : t('inactive')}
                                                </span>
                                            </h4>
                                            <p>{t('dayOfMonth')}: {rec.day_of_month} {rec.description ? `• ${rec.description}` : ''}</p>
                                        </div>
                                        <div className={`recurring-amount ${rec.type}`}>
                                            {rec.type === 'income' ? '+' : '-'}{formatCurrency(rec.amount, currency)}
                                        </div>
                                        <div className="item-actions">
                                            <button className="btn-edit-item" onClick={() => openRecurringModal(rec)}>✏️</button>
                                            <button className="btn-delete-item" onClick={() => openDeleteModal('recurring', rec.id, rec.category)}>🗑️</button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        {/* Loans Section */}
                        <div className="card" style={{marginBottom: '24px'}}>
                            <div className="section-header" style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px'}}>
                                <h2><span className="icon">🏦</span> {t('loans')}</h2>
                                <button className="add-goal-btn" onClick={() => openLoanModal()}>{t('addLoan')}</button>
                            </div>
                            {loans.length === 0 ? (
                                <div className="empty-state">
                                    <p>{t('noLoans')}</p>
                                    <p style={{fontSize: '0.8rem', marginTop: '8px'}}>{t('loansDesc')}</p>
                                </div>
                            ) : (
                                loans.map(loan => {
                                    const { totalAmount, progress } = getLoanProgress(loan);
                                    return (
                                        <div key={loan.id} className="loan-item">
                                            <div className="loan-info" style={{flex: 1}}>
                                                <h4>{loan.name}</h4>
                                                <p>{t('monthlyPayment')}: {formatCurrency(loan.monthly_payment, currency)}</p>
                                                <p>{loan.interest_rate}% • {loan.term_months} {t('months')[0]}</p>
                                            </div>
                                            <div className="loan-details">
                                                <div className="loan-amount">{formatCurrency(loan.principal, currency)}</div>
                                            </div>
                                            <div className="item-actions">
                                                <button className="btn-edit-item" onClick={() => openLoanModal(loan)}>✏️</button>
                                                <button className="btn-delete-item" onClick={() => openDeleteModal('loan', loan.id, loan.name)}>🗑️</button>
                                            </div>
                                            <div className="loan-progress" style={{marginTop: '12px'}}>
                                                <div className="loan-progress-bar" style={{width: `${progress}%`}}></div>
                                            </div>
                                            <div style={{display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', color: '#64748b', marginTop: '6px'}}>
                                                <span>{formatCurrency(loan.total_paid, currency)} {t('paidOf')} {formatCurrency(totalAmount, currency)}</span>
                                                <span>{progress.toFixed(0)}%</span>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>

                        {/* Delete Confirmation Modal */}
                        <div className={`modal-overlay confirm-delete-modal ${deleteModalOpen ? 'active' : ''}`} onClick={() => setDeleteModalOpen(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <h3>⚠️ {t('confirmDelete')}</h3>
                                <p className="modal-message">
                                    {deleteTarget.type === 'transaction' && t('deleteTransactionMsg')}
                                    {deleteTarget.type === 'recurring' && t('deleteRecurringMsg')}
                                    {deleteTarget.type === 'loan' && t('deleteLoanMsg')}
                                </p>
                                <div className="modal-actions">
                                    <button className="btn-cancel" onClick={() => setDeleteModalOpen(false)}>{t('cancel')}</button>
                                    <button className="btn-delete" onClick={handleConfirmDelete} disabled={deleting}>
                                        {deleting ? t('deleting') : t('delete')}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Recurring Transaction Modal */}
                        <div className={`modal-overlay ${recurringModalOpen ? 'active' : ''}`} onClick={() => setRecurringModalOpen(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <h3>🔄 {selectedRecurring ? t('editRecurring') : t('newRecurring')}</h3>
                                <form onSubmit={handleSaveRecurring}>
                                    <div className="form-group">
                                        <label>{t('type')}</label>
                                        <select value={recurringForm.type} onChange={(e) => setRecurringForm({...recurringForm, type: e.target.value, category: ''})}>
                                            <option value="expense">{t('expense')}</option>
                                            <option value="income">{t('income')}</option>
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label>{t('amount')}</label>
                                        <div className="input-with-prefix">
                                            <span className="currency-prefix">{currencySymbols[currency]}</span>
                                            <input type="number" step="0.01" min="0" value={recurringForm.amount} onChange={(e) => setRecurringForm({...recurringForm, amount: e.target.value})} required placeholder="0.00" />
                                        </div>
                                    </div>
                                    <div className="form-group">
                                        <label>{t('category')}</label>
                                        <select value={recurringForm.category} onChange={(e) => setRecurringForm({...recurringForm, category: e.target.value})} required>
                                            <option value="">{t('selectCategory')}</option>
                                            {categories[recurringForm.type].map(cat => (
                                                <option key={cat} value={cat}>{cat}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div className="form-group">
                                        <label>{t('dayOfMonth')}</label>
                                        <input type="number" min="1" max="28" value={recurringForm.day_of_month} onChange={(e) => setRecurringForm({...recurringForm, day_of_month: e.target.value})} required />
                                    </div>
                                    <div className="form-group">
                                        <label>{t('description')}</label>
                                        <input type="text" value={recurringForm.description} onChange={(e) => setRecurringForm({...recurringForm, description: e.target.value})} placeholder={t('optional')} />
                                    </div>
                                    <div className="modal-actions">
                                        <button type="button" className="btn-cancel" onClick={() => setRecurringModalOpen(false)}>{t('cancel')}</button>
                                        <button type="submit" className="btn-save" disabled={submitting}>{submitting ? t('saving') : t('save')}</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        {/* Loan Modal */}
                        <div className={`modal-overlay ${loanModalOpen ? 'active' : ''}`} onClick={() => setLoanModalOpen(false)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()}>
                                <h3>🏦 {selectedLoan ? t('editLoan') : t('newLoan')}</h3>
                                <form onSubmit={handleSaveLoan}>
                                    <div className="form-group">
                                        <label>{t('loanName')}</label>
                                        <input type="text" value={loanForm.name} onChange={(e) => setLoanForm({...loanForm, name: e.target.value})} required />
                                    </div>
                                    <div className="form-group">
                                        <label>{t('principal')}</label>
                                        <div className="input-with-prefix">
                                            <span className="currency-prefix">{currencySymbols[currency]}</span>
                                            <input type="number" step="0.01" min="0" value={loanForm.principal} onChange={(e) => setLoanForm({...loanForm, principal: e.target.value})} required placeholder="0.00" />
                                        </div>
                                    </div>
                                    <div className="form-group">
                                        <label>{t('interestRate')}</label>
                                        <input type="number" step="0.01" min="0" max="100" value={loanForm.interest_rate} onChange={(e) => setLoanForm({...loanForm, interest_rate: e.target.value})} required placeholder="%" />
                                    </div>
                                    <div className="form-group">
                                        <label>{t('termMonths')}</label>
                                        <input type="number" min="1" value={loanForm.term_months} onChange={(e) => setLoanForm({...loanForm, term_months: e.target.value})} required />
                                    </div>
                                    <div className="form-group">
                                        <label>{t('monthlyPayment')}</label>
                                        <div className="input-with-prefix">
                                            <span className="currency-prefix">{currencySymbols[currency]}</span>
                                            <input type="number" step="0.01" min="0" value={loanForm.monthly_payment} onChange={(e) => setLoanForm({...loanForm, monthly_payment: e.target.value})} required placeholder="0.00" />
                                        </div>
                                    </div>
                                    <div className="form-group">
                                        <label>{t('startDate')}</label>
                                        <input type="date" value={loanForm.start_date} onChange={(e) => setLoanForm({...loanForm, start_date: e.target.value})} required />
                                    </div>
                                    <div className="modal-actions">
                                        <button type="button" className="btn-cancel" onClick={() => setLoanModalOpen(false)}>{t('cancel')}</button>
                                        <button type="submit" className="btn-save" disabled={submitting}>{submitting ? t('saving') : t('save')}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // =====================
        // Professional Logo Component
        // =====================
        function AnimatedLogo({ size = "large" }) {
            const containerStyle = {
                position: 'relative',
                width: size === "large" ? '500px' : '350px',
                maxWidth: '90vw',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                margin: '0 auto'
            };
            
            const logoStyle = {
                width: '100%',
                height: 'auto',
                filter: 'drop-shadow(0 8px 32px rgba(249, 115, 22, 0.4))',
                transition: 'transform 0.3s ease, filter 0.3s ease'
            };
            
            const [isHovered, setIsHovered] = React.useState(false);
            
            return (
                <div 
                    style={containerStyle} 
                    className="logo-container"
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                >
                    <img 
                        src={TRACKER_LOGO} 
                        alt="Tracker" 
                        style={{
                            ...logoStyle,
                            transform: isHovered ? 'scale(1.02)' : 'scale(1)',
                            filter: isHovered 
                                ? 'drop-shadow(0 12px 40px rgba(249, 115, 22, 0.5))' 
                                : 'drop-shadow(0 8px 32px rgba(249, 115, 22, 0.4))'
                        }} 
                    />
                </div>
            );
        }

        // =====================
        // Main App Component
        // =====================
        function App() {
            const [user, setUser] = React.useState(null);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                // Check for existing session
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user || null);
                    setLoading(false);
                });

                // Listen for auth changes
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setUser(session?.user || null);
                });

                return () => subscription.unsubscribe();
            }, []);

            const handleLogout = async () => {
                await supabase.auth.signOut();
                setUser(null);
            };

            if (loading) {
                return (
                    <div className="full-loading">
                        <div className="loading-spinner"></div>
                        <p>Loading Tracker...</p>
                    </div>
                );
            }

            if (!user) {
                return <AuthPage onAuthSuccess={setUser} />;
            }

            return <Dashboard user={user} onLogout={handleLogout} />;
        }

        // =====================
        // Render App
        // =====================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
